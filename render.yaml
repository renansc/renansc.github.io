services:
  - type: web
    name: renansc-portal
    runtime: python
    plan: starter
    buildCommand: apt-get update && apt-get install -y libzbar0 && pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: FINANCE_AI_MODEL
        value: "gpt-5.4"
      - key: FINANCE_AI_SEARCH_CONTEXT
        value: "medium"
