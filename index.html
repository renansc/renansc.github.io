<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Renan SC | Portal de Aplicativos</title>
  <meta name="description" content="Acesso rápido aos aplicativos GPS Musical e Financeiro Nanotech." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">RC</div>
      <div>
        <h1>Renan SC - Portal de Aplicativos</h1>
        <p>Menu principal para acessar seus sistemas</p>
      </div>
    </div>
    <nav aria-label="Menu principal">
      <ul class="menu" id="menuLinks"></ul>
    </nav>
  </header>

  <main class="container">
    <section class="hero card">
      <h2>Aplicativos disponíveis</h2>
      <p>Escolha um aplicativo para abrir diretamente.</p>
    </section>

    <section class="apps-grid" id="appsGrid" aria-label="Lista de aplicativos"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
